version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: N@im2002
      MYSQL_DATABASE: factory_traffic
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: 
      context: ./backend
    restart: always
    ports:
      - "3000:3000"
      - "1883:1883"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=N@im2002
      - DB_NAME=factory_traffic
      - MQTT_PORT=1883
      - PORT=3000
      - START_SIMULATOR=true
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
